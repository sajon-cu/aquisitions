name: Tests

on:
    push:
        branches: [main, staging]
    pull_request:
        branches: [main, staging]

permissions:
    contents: read

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
            NODE_OPTIONS: --experimental-vm-modules
            DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://user:password@localhost:5432/test' }}
            JWT_SECRET: test-secret
            ARCJET_KEY: test-arcjet-key
            LOG_LEVEL: error
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              id: tests
              run: |
                  set -o pipefail
                  npm test 2>&1 | tee test-output.log

            - name: Annotate test failures
              if: failure() && steps.tests.outcome == 'failure'
              run: |
                  echo "::error title=Tests failed::npm test exited with a failure. See the 'Run tests' step log for details."
                  # Annotate each failing test/suite line reported by the runner
                  grep -E '^\s*(✕|✖|FAIL|not ok)' test-output.log | head -n 50 | while IFS= read -r line; do
                    echo "::error title=Test failure::$(echo "$line" | sed 's/^[[:space:]]*//')"
                  done || true

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Generate summary
              if: always()
              run: |
                  {
                    echo "## Test Results"
                    echo ""
                    if [ "${{ steps.tests.outcome }}" = "success" ]; then
                      echo "✅ All tests passed"
                    else
                      echo "❌ Tests failed"
                    fi
                    echo ""
                    if [ -f coverage/coverage-summary.json ]; then
                      echo "### Coverage"
                      node -e '
                        const t = require("./coverage/coverage-summary.json").total;
                        console.log("| Metric | Covered |\n|---|---|");
                        for (const k of ["lines","statements","functions","branches"]) console.log(`| ${k} | ${t[k].pct}% |`);
                      '
                    elif [ -d coverage ]; then
                      echo "Coverage report generated and uploaded as the \`coverage-report\` artifact."
                    else
                      echo "No coverage report was generated."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
