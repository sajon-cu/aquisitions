name: Lint and Format

on:
    push:
        branches: [main, staging]
    pull_request:
        branches: [main, staging]

permissions:
    contents: read

jobs:
    lint-and-format:
        name: ESLint and Prettier
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              id: lint
              continue-on-error: true
              run: npm run lint

            - name: Run Prettier check
              id: format
              continue-on-error: true
              run: npm run format:check

            - name: Annotate and fail on issues
              if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure'
              run: |
                  if [ "${{ steps.lint.outcome }}" = "failure" ]; then
                    echo "::error title=ESLint failed::Linting issues found. Run 'npm run lint:fix' locally to fix them automatically, then commit the changes."
                  fi
                  if [ "${{ steps.format.outcome }}" = "failure" ]; then
                    echo "::error title=Prettier check failed::Formatting issues found. Run 'npm run format' locally to format the code, then commit the changes."
                  fi
                  exit 1

            - name: Summary
              if: always()
              run: |
                  {
                    echo "## Lint and Format"
                    echo "| Check | Result |"
                    echo "|---|---|"
                    echo "| ESLint | ${{ steps.lint.outcome }} |"
                    echo "| Prettier | ${{ steps.format.outcome }} |"
                  } >> "$GITHUB_STEP_SUMMARY"
